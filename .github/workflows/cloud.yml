name: Cloud contracts

# ixtable Cloud contract tests against a real local Supabase stack (PRD §26.5):
# Edge Function Deno unit tests, the service-qa API contract specs (RLS
# private-by-default, revocation, key grants, backups, billing), and the desktop
# cloud integration tests through the real Rust bridge. Ubuntu only: the stack
# runs in Docker, and the desktop side is covered on every OS by desktop.yml.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'scripts/cloud/**'
      - 'src/cloud/**'
      - 'src-tauri/src/cloud/**'
      - 'tests/integration/cloud-*'
      - 'web/e2e/service-qa/**'
      - 'web/playwright.service-qa.config.ts'
      - '.github/workflows/cloud.yml'
  pull_request:
    paths:
      - 'supabase/**'
      - 'scripts/cloud/**'
      - 'src/cloud/**'
      - 'src-tauri/src/cloud/**'
      - 'tests/integration/cloud-*'
      - 'web/e2e/service-qa/**'
      - 'web/playwright.service-qa.config.ts'
      - '.github/workflows/cloud.yml'

permissions:
  contents: read

concurrency:
  group: cloud-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

defaults:
  run:
    shell: bash

jobs:
  contracts:
    name: Cloud contracts (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-desktop
        with:
          cache-key: cloud
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Generates supabase/functions/.env.local (dev-only secrets), starts the
      # stack, resets the database, and waits for /functions/v1/health.
      - name: Start local Supabase stack
        run: node scripts/cloud/up.mjs
      # The desktop tests verify signed bundles with the stack's generated key.
      - name: Export the dev signing public key
        run: |
          key=$(sed -n 's/^IXTABLE_CLOUD_PUBLIC_KEY_RAW=//p' supabase/functions/.env.local)
          test -n "$key"
          echo "IXTABLE_CLOUD_PUBLIC_KEY_RAW=$key" >> "$GITHUB_ENV"
      # Deno comes from npm (npx deno@<pinned>) inside the script.
      - name: Edge Function type check and Deno unit tests
        run: npm run service-qa:deno
      - name: Install website dependencies
        run: npm ci --prefix web
      # API-level specs only: no browser and no web server.
      - name: Service contract specs
        run: npm run service-qa:contracts
      - name: Build NAPI test bridge
        run: npm run pretest
      - name: Desktop cloud integration tests
        run: >-
          npx vitest run --config vitest.integration.config.ts
          tests/integration/cloud-auth.test.tsx tests/integration/cloud-distribution.test.tsx
          --reporter=default --reporter=junit --outputFile.junit=reports/cloud.xml
      # Skipped suites would pass silently: fail if the stack was not detected.
      - name: Check the cloud tests ran
        run: node -e "const x=require('fs').readFileSync('reports/cloud.xml','utf8'); if(/<skipped/.test(x)){console.error('cloud integration tests were skipped');process.exit(1)}"
      - name: Supabase logs on failure
        if: failure()
        run: docker ps -a --format '{{.Names}}' | grep supabase | while read -r name; do echo "::group::$name"; docker logs --tail 200 "$name" 2>&1; echo "::endgroup::"; done
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-evidence
          path: |
            reports/
            web/test-results/service-qa/
          if-no-files-found: ignore
          retention-days: 7
