[package]
name = "ixtable"
version = "0.1.0"
description = "ixtable desktop application"
authors = ["ixtable"]
edition = "2021"

[lib]
name = "ixtable_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
napi-build = "2"

[features]
default = []
test-bridge = ["dep:tauri-test", "dep:napi", "dep:napi-derive"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-test = { version = "0.2.1", optional = true }
napi = { version = "2", default-features = false, features = ["napi8", "async", "serde-json"], optional = true }
napi-derive = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9.34"
rusqlite = { version = "0.32", features = ["bundled"] }
zstd = "0.13"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
base64 = "0.22"
duckdb = { version = "=1.10505.0", features = ["bundled"] }
tauri-plugin-dialog = "2"

[dev-dependencies]
proptest = "1.7"

# Desktop-only (PRD §6.2): no staticlib, and lean debug info keeps test-bridge builds small.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
