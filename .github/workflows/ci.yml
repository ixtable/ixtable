name: CI

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'supabase/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - 'supabase/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Typecheck
        working-directory: web
        run: npm run typecheck

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Same CLI pin as cloud.yml.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      # Bare `supabase start` boots every Edge Function with BOOT_ERROR: up.mjs
      # also writes the dev function secrets, installs the functions' npm deps
      # (supabase/functions/node_modules), resets the db and waits for health.
      - name: Start local Supabase stack
        run: node scripts/cloud/up.mjs
      - name: Export Supabase env
        run: |
          STATUS=$(supabase status -o env)
          API_URL=$(echo "$STATUS" | grep '^API_URL=' | cut -d= -f2- | tr -d '"')
          ANON_KEY=$(echo "$STATUS" | grep '^ANON_KEY=' | cut -d= -f2- | tr -d '"')
          SERVICE_ROLE_KEY=$(echo "$STATUS" | grep '^SERVICE_ROLE_KEY=' | cut -d= -f2- | tr -d '"')
          echo "SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Build site
        working-directory: web
        run: npm run build
      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        working-directory: web
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
