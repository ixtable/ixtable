name: Release

# Signed desktop installers and update channels (PRD §6.1, §27.2, Phase 5).
# Tag vX.Y.Z → stable, vX.Y.Z-pre → beta; manual runs choose draft/beta/stable.
# beta/stable fail closed when any signing secret is missing or a public key is
# missing or a dev/test key (scripts/release/keys.mjs). Runbook and gates:
# docs/release-checklist.md, docs/release/checklist.md; secrets: docs/release/signing.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      channel:
        description: 'draft builds unsigned-if-needed artifacts only; beta/stable must run from the version tag'
        type: choice
        options: [draft, beta, stable]
        default: draft

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan release
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.plan.outputs.channel }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      # Fails when the tag, tauri.conf.json, package.json and Cargo.toml disagree.
      - id: plan
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: node scripts/release/plan.mjs
      # Automated PRD §21.3/§27.2/Phase 5 gates (docs/release-checklist.md); sign-offs print as pending.
      - name: Release gates (automated)
        run: node scripts/ci/release-gates.mjs

  gates:
    name: Release gates (${{ matrix.os }})
    needs: plan
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Disable CRLF conversion
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-desktop
        with:
          cache-key: release-gates
      - name: Typecheck and lint
        if: runner.os == 'Linux'
        run: npx tsc --noEmit && npm run lint
      - name: Rust unit tests
        working-directory: src-tauri
        run: cargo test --lib
      - name: Build NAPI test bridge
        run: npm run pretest
      - name: Unit tests
        run: npx vitest run --passWithNoTests
      - name: Integration tests
        run: npx vitest run --config vitest.integration.config.ts --exclude "tests/integration/golden/**"
      - name: Golden application suites
        run: npx vitest run --config vitest.integration.config.ts tests/integration/golden

  build:
    name: Build ${{ matrix.platform }}
    needs: [plan, gates]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
            duckdb: macos-universal
            args: --target universal-apple-darwin
            binary: src-tauri/target/universal-apple-darwin/release/bundle/macos/ixtable.app/Contents/MacOS/ixtable
          - platform: windows
            os: windows-latest
            duckdb: windows-x64
            args: ''
            binary: src-tauri/target/release/ixtable.exe
          # The oldest supported Ubuntu keeps the AppImage's glibc floor low.
          - platform: linux
            os: ubuntu-22.04
            duckdb: linux-x64
            args: ''
            binary: src-tauri/target/release/ixtable
    runs-on: ${{ matrix.os }}
    env:
      CHANNEL: ${{ needs.plan.outputs.channel }}
      # Production ixtable Cloud (cloud/config.rs build defaults; repository variables).
      IXTABLE_CLOUD_BUILD_URL: ${{ vars.IXTABLE_CLOUD_BUILD_URL }}
      IXTABLE_CLOUD_BUILD_ANON_KEY: ${{ vars.IXTABLE_CLOUD_BUILD_ANON_KEY }}
      IXTABLE_CLOUD_BUILD_SITE_URL: ${{ vars.IXTABLE_CLOUD_BUILD_SITE_URL }}
      # Production public keys (docs/decisions/desktop-updates.md). The cloud key is pinned
      # at compile time (cloud/config.rs); the updater key goes into the --config override.
      IXTABLE_CLOUD_PUBLIC_KEY_RAW: ${{ vars.IXTABLE_CLOUD_PUBLIC_KEY_RAW }}
      IXTABLE_CLOUD_PUBLIC_KEY: ${{ vars.IXTABLE_CLOUD_PUBLIC_KEY }}
      IXTABLE_UPDATER_PUBKEY: ${{ vars.IXTABLE_UPDATER_PUBKEY }}
      # beta/stable: build.rs refuses a missing or dev key, and keys.mjs build checks the binary
      # before tauri-action uploads it. Draft runs (and local `tauri build`) are dev builds.
      IXTABLE_RELEASE: ${{ needs.plan.outputs.channel != 'draft' && '1' || '' }}
      IXTABLE_RELEASE_BINARY: ${{ matrix.binary }}
    steps:
      - name: Disable CRLF conversion
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-desktop
        with:
          cache-key: release-${{ matrix.platform }}
      - name: Rust targets for the universal macOS binary
        if: matrix.platform == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Linux bundling and smoke-test dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get install -y --no-install-recommends libfuse2 xvfb

      # Fresh download, not the cache: every file is SHA-256 pinned by the script.
      - name: Prepare pinned DuckDB extensions (sqlite + postgres scanners)
        run: bash scripts/prepare-duckdb-artifacts.sh "${{ matrix.duckdb }}"
      # The app bundles only the compressed archives (tauri.conf.json resources) and
      # unpacks them on first use, so no ad-hoc-signed Mach-O reaches notarization.
      - name: Check bundled DuckDB resources
        run: |
          case "${{ matrix.duckdb }}" in
            macos-universal) dirs="macos-arm64 macos-x64" ;;
            *) dirs="${{ matrix.duckdb }}" ;;
          esac
          for d in $dirs; do
            for ext in sqlite_scanner postgres_scanner; do
              test -s "src-tauri/resources/duckdb/$d/$ext.duckdb_extension.gz" || { echo "::error::missing $d/$ext.duckdb_extension.gz"; exit 1; }
            done
          done

      # Fails beta/stable runs with missing secrets or missing/dev public keys; exports only the set ones.
      - name: Signing setup
        id: signing
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERTIFICATE_PROFILE: ${{ secrets.AZURE_CERTIFICATE_PROFILE }}
        run: >-
          node scripts/release/signing.mjs --platform "${{ matrix.platform }}" --channel "$CHANNEL"
          --out "$RUNNER_TEMP/tauri.release.json"
      # The private key must sign what IXTABLE_UPDATER_PUBKEY verifies, or installed apps reject updates.
      - name: Check the updater key pair
        if: steps.signing.outputs.updater == 'true' && env.CHANNEL != 'draft'
        run: node scripts/release/keys.mjs probe
      - name: Install Azure Trusted Signing client
        if: matrix.platform == 'windows' && steps.signing.outputs.signed == 'true'
        run: cargo install trusted-signing-cli --locked

      - name: Build, sign, and upload to the draft release
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Empty for draft runs: build only, no GitHub release.
          tagName: ${{ needs.plan.outputs.tag }}
          releaseName: ixtable ${{ needs.plan.outputs.version }}
          releaseBody: 'Draft. Publish only after docs/release/checklist.md passes.'
          releaseDraft: true
          prerelease: ${{ needs.plan.outputs.prerelease == 'true' }}
          includeUpdaterJson: ${{ needs.plan.outputs.channel != 'draft' }}
          updaterJsonPreferNsis: true
          # `tauri build`, then the embedded-key check, so a binary that does not pin the
          # release keys fails here, before tauri-action uploads anything.
          tauriScript: node scripts/release/keys.mjs
          args: ${{ matrix.args }} --config ${{ runner.temp }}/tauri.release.json

      - name: Verify updater signatures against the release pubkey
        if: steps.signing.outputs.updater == 'true'
        env:
          ARTIFACTS: ${{ steps.tauri.outputs.artifactPaths }}
        run: node scripts/release/update-manifest.mjs verify --json "$ARTIFACTS"
      - name: Check the macOS app holds only compressed DuckDB extensions
        if: matrix.platform == 'macos'
        run: |
          app="src-tauri/target/universal-apple-darwin/release/bundle/macos/ixtable.app"
          if find "$app" -name '*.duckdb_extension' | grep .; then
            echo "::error::uncompressed DuckDB extensions in the app bundle"; exit 1
          fi
          test "$(find "$app" -name '*.duckdb_extension.gz' | wc -l)" -eq 4 || { echo "::error::expected 4 extension archives"; exit 1; }
      - name: Verify macOS signature, notarization, and Gatekeeper
        if: matrix.platform == 'macos' && steps.signing.outputs.signed == 'true'
        run: |
          app="src-tauri/target/universal-apple-darwin/release/bundle/macos/ixtable.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=4 "$app"
          for dmg in src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg; do
            xcrun stapler validate "$dmg"
          done
          lipo -archs "$app/Contents/MacOS/ixtable" | grep -q arm64
          lipo -archs "$app/Contents/MacOS/ixtable" | grep -q x86_64
      - name: Verify Windows Authenticode signatures
        if: matrix.platform == 'windows' && steps.signing.outputs.signed == 'true'
        shell: pwsh
        run: |
          $files = Get-ChildItem src-tauri/target/release/bundle -Recurse -Include *.exe,*.msi
          $files += Get-Item src-tauri/target/release/ixtable.exe
          foreach ($f in $files) {
            $s = Get-AuthenticodeSignature $f.FullName
            if ($s.Status -ne 'Valid') { Write-Error "$($f.Name): $($s.Status)"; exit 1 }
            Write-Host "$($f.Name): $($s.SignerCertificate.Subject)"
          }
      - name: Smoke launch
        run: |
          if [ "${{ matrix.platform }}" = linux ]; then
            xvfb-run -a node scripts/release/smoke.mjs "${{ matrix.binary }}" 20
          else
            node scripts/release/smoke.mjs "${{ matrix.binary }}" 20
          fi

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ixtable-${{ needs.plan.outputs.version }}-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/
            src-tauri/target/universal-apple-darwin/release/bundle/
          if-no-files-found: error
          retention-days: 14

  publish-update-manifest:
    name: Publish ${{ needs.plan.outputs.channel }} update manifest
    needs: [plan, build]
    if: needs.plan.outputs.channel != 'draft'
    runs-on: ubuntu-latest
    # Configure required reviewers on these environments: approval is the checklist sign-off.
    environment: release-${{ needs.plan.outputs.channel }}
    permissions:
      contents: write
    env:
      CHANNEL: ${{ needs.plan.outputs.channel }}
      TAG: ${{ needs.plan.outputs.tag }}
      RELEASE_BASE_URL: ${{ vars.RELEASE_BASE_URL || 'https://releases.ixtable.app' }}
      RELEASE_S3_BUCKET: ${{ secrets.RELEASE_S3_BUCKET }}
      RELEASE_S3_ENDPOINT: ${{ secrets.RELEASE_S3_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.RELEASE_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.RELEASE_S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.RELEASE_S3_REGION || 'auto' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      IXTABLE_UPDATER_PUBKEY: ${{ vars.IXTABLE_UPDATER_PUBKEY }}
    steps:
      - name: Check release host configuration
        id: host
        run: |
          missing=""
          for name in RELEASE_S3_BUCKET RELEASE_S3_ENDPOINT AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::notice::Release host not configured (missing:$missing); skipping the $CHANNEL manifest upload. Installers are on the draft release."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.host.outputs.configured == 'true'
      - uses: actions/setup-node@v4
        if: steps.host.outputs.configured == 'true'
        with:
          node-version: lts/*
      - name: Download release assets
        if: steps.host.outputs.configured == 'true'
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets
      # Verifies every platform's signature against IXTABLE_UPDATER_PUBKEY (never the dev key) before anything is uploaded.
      - name: Prepare channel manifests
        if: steps.host.outputs.configured == 'true'
        run: |
          beta_current=""
          if [ "$CHANNEL" = stable ]; then
            beta_current="$(curl -fsSL "$RELEASE_BASE_URL/beta/latest.json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).version))' || true)"
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          node scripts/release/update-manifest.mjs prepare --manifest assets/latest.json --assets assets \
            --channel "$CHANNEL" --base "$RELEASE_BASE_URL" --out out --notes notes.md \
            ${beta_current:+--beta-current "$beta_current"}
      - name: Upload payloads, then manifests
        if: steps.host.outputs.configured == 'true'
        run: |
          aws s3 cp out/ "s3://$RELEASE_S3_BUCKET/" --recursive --exclude "*/latest.json" \
            --endpoint-url "$RELEASE_S3_ENDPOINT"
          for manifest in out/*/latest.json; do
            aws s3 cp "$manifest" "s3://$RELEASE_S3_BUCKET/${manifest#out/}" \
              --endpoint-url "$RELEASE_S3_ENDPOINT" \
              --content-type application/json --cache-control "no-cache, max-age=0"
          done
